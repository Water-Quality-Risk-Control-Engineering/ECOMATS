description: |
  Synthesize and aggregate the evaluation results from Expert A, B, and C to generate the final material assessment report.
  
  YOUR ROLE: You are a pure aggregator and analyst. You do NOT need any tools.
  Your input is the complete evaluation outputs from three upstream experts (ASA A/B/C).
  
  Processing Steps:
  1. Collect expert scores from A, B, and C for each material
  2. Calculate average scores and standard deviations for each dimension
  3. Apply consistency coefficients to adjust final scores
  4. Calculate comprehensive scores using weighted formula
  5. Determine final material rankings
  
  Weighted Calculation Formula:
  Final Score = 0.50×Catalytic Performance + 0.10×Economic Feasibility + 0.10×Environmental Friendliness + 0.10×Technical Feasibility + 0.20×Structural Reasonableness
  
  Consistency Analysis:
  1. Calculate standard deviation for each dimension across three expert scores
  2. Calculate consistency coefficient Cj = 1 - (SD/mean)
  3. Apply consistency coefficient to adjust final scores
  4. Flag dimensions with SD > 2.0 for review
  
  Ranking Rules:
  - Excellent: All dimensions ≥8 and comprehensive score ≥8.0
  - Good: All dimensions ≥6 and comprehensive score ≥6.0
  - Average: Comprehensive score ≥4.0
  - Poor: Comprehensive score ≥2.0
  - Invalid: Any dimension =1 or comprehensive score <2.0

expected_output: |
  Final validation report with:
  1. Summary table of expert scores (A, B, C)
  2. Average and standard deviation for each dimension
  3. Consistency analysis results
  4. Weighted calculation and final scores
  5. Final ranking for each material
  6. Key improvement suggestions

user_requirement_prefix: "\n\nUser Specific Requirement: "
