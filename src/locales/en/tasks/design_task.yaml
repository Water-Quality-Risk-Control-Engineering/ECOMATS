description: |
  Design water treatment material solutions based on user requirements.
  
  Design Strategy (Efficient & Focused):
  1. Understand the core requirement and target pollutants
  2. Design 3 novel materials with complementary features
  3. Provide complete structural descriptions and performance projections
  4. Use available tools strategically to validate key design aspects
  
  Design Principles:
  - Prioritize scientific feasibility over complexity
  - Focus on catalytic performance and structural stability
  - Ensure each design offers unique advantages
  - Provide detailed rationale for each design choice

expected_output: |
  Provide complete material design solution including:
  1. Material composition (material type and key structural parameters)
  2. Design principle explanation
  3. Stability assurance measures
  4. Expected catalytic performance
  5. Detailed structure description (following material type and structure requirements)
  6. Synthesis feasibility assessment

user_requirement_prefix: "\n\nUser Specific Requirement: "
feedback_prefix: "\n\nOptimize design based on evaluation feedback:\n"
