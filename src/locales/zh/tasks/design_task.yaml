description: |
  根据用户需求设计水处理材料方案。
  
  设计流程（分步执行）：
  1. 分析目标污染物 → 使用 PubChem 理解污染物化学特性
  2. 识别材料类型 → 使用 Material Identifier 确定适当的材料类别
  3. 查询材料数据库 → 使用 Materials Project 获取结构和性质数据
  4. 验证材料结构 → 使用 Structure Validator 确保设计可行性
  5. 如验证失败，选择备选设计方案（避免重复验证尝试）
  
  工具使用策略：
  1. **污染物分析**：PubChem 查询目标污染物的化学性质和反应活性
  2. **材料识别**：Material Identifier 对材料进行分类和归类
  3. **数据查询**：Materials Project 获取已有材料结构和性质作为参考
  4. **结构验证**：Structure Validator 验证设计结构的化学有效性
  
  设计要点：
  - 确保材料具有良好的催化性能和结构稳定性
  - 验证失败时选择备选设计方案
  - 优先复用已获取的工具数据
  - 为每个设计选择提供详细的科学依据

expected_output: |
  提供完整的材料设计方案，包括：
  1. 材料组成（材料类型和关键结构参数）
  2. 设计原理说明
  3. 稳定性保障措施
  4. 预期的催化性能
  5. 详细的结构描述（按照材料类型分类和结构描述要求）
  6. 合成可行性评估

user_requirement_prefix: "\n\n用户具体需求："
feedback_prefix: "\n\n根据评估反馈进行优化设计：\n"
