description: |
  请基于最终验证通过的材料方案，进行深入的机理分析。
  
  核心分析目标：
  1. 全面解析材料的微观结构与宏观性能关系
  2. 深入揭示催化反应的分子级机制
  3. 建立结构-性能关系的定量描述
  4. 提供可验证的机理预测和优化建议
  
  工具使用策略：
  1. **复用上游数据**：首先检查上游任务是否已有Material Identifier和Structure Validator结果
  2. **金属材料数据**：仅在未获取时调用Materials Project查询电子结构
  3. **有机污染物数据**：仅在未获取时调用PubChem查询分子结构
  4. **补充查询**：仅查询上游未提供的数据
  5. **机理分析**：综合所有可用数据进行全面分析
  
  分析维度要求（必须包含所有维度）：
  1. 微观结构机理：原子/分子结构、活性位点、配体作用
  2. 作用机理分析：催化活化过程、吸附机制、电子转移、自由基介导
  3. 构效关系：结构与催化性能的定量关系
  4. 界面作用机理：固-液界面相互作用、表面反应机制
  5. 传质和热传导机理：扩散过程、热量产生和耗散
  6. 稳定性机理：结构稳定性、抗浸出性、长期性能维持
  7. 优化机理分析：基于结构的优化策略、性能增强机制
  8. 多尺度建模：量子、分子和介观尺度模型整合
  9. 关键影响因素：pH、温度、离子强度等影响分析
  10. 机理验证方案：DFT计算验证、实验验证、数据库交叉验证
  
  工具使用要求：
  - 所有工具查询结果必须在分析中引用
  - 如果工具查询未返回结果，必须说明对分析的影响
  - 每个工具调用都必须记录具体的参数和返回结果

expected_output: |
  提供详细的机理分析报告，必须包含以下所有维度：
  1. 微观结构机理分析
  2. 催化机制和反应路径
  3. 结构-活性关系的定量数据
  4. 界面反应机理
  5. 传质/传热分析
  6. 稳定性机理评估
  7. 优化策略
  8. 多尺度建模结果
  9. 关键影响因素分析
  10. 机理验证方案
  
  工具数据要求（必须包含）：
  - Materials Project数据：带隙、密度、形成能等
  - PubChem数据：分子结构、化合物CID
  - material_search_tool数据：相似材料性能对比
  - structure_validator_tool数据：结构验证结果

user_requirement_prefix: "\n\n用户具体需求："
