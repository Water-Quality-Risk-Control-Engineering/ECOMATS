description: |
  请根据以下五个维度评估材料方案的性能：
  1. 催化性能（权重50%）
  2. 经济可行性（权重10%）
  3. 环境友好性（权重10%）
  4. 技术可行性（权重10%）
  5. 结构合理性（权重20%）
  
  其中，催化性能是核心标准。
  
  评估步骤：
  1. 分析材料方案在上述五个维度的表现
  2. 重点关注催化性能是否达到标准
  3. 如果催化性能不符合标准，请明确指出问题并建议返回材料设计阶段重新设计
  4. 如果催化性能达标，再综合评估其他维度
  
  工具使用策略：
  1. **数据收集阶段**：调用Material Identifier Tool和Structure Validator Tool
  2. **结构合理性验证**：调用Materials Project和PubChem工具验证结构
  3. **催化性能评估**：调用Material Search Tool查询类似材料性能数据
  4. **经济可行性评估**：调用工具获取成本相关数据
  5. **环境友好性评估**：调用PNEC Tool和PubChem工具
  6. **技术可行性评估**：评估合成方法和工业化可行性
  7. **数据验证阶段**：交叉验证所有工具查询结果
  
  评估要求：
  - 独立进行评估，重点关注材料的科学合理性和实际应用潜力
  - 必须使用工具验证材料信息的准确性
  - **必须验证材料结构在现实中是否存在**
  - 每个工具调用都必须记录具体的参数和返回结果
  
  评估结果输出格式：
  1. 各维度评分（满分10分）
  2. 核心标准评估：催化性能达标/不达标
  3. 综合评价和决策建议
  4. 工具验证结果

expected_output: |
  提供详细的材料方案评价报告，包括：
  1. 各维度评分和分析
  2. 核心标准评估结果
  3. 明确的决策建议（通过或返回重新设计）
  4. 如果需要重新设计，提供具体的改进建议
  5. 工具验证结果（必须包含具体的数据和查询结果）
  6. 工具数据如何支持评分决定的详细说明

user_requirement_prefix: "\n\n用户提供的材料信息："
