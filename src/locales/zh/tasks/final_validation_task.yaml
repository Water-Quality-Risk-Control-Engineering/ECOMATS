description: |
  综合专家A、B、C的评估结果，生成最终材料评估报告。
  
  你的角色：你是纯粹的结果聚合者和分析者，不需要使用任何工具。
  你的输入是三位上游专家（ASA A/B/C）的完整评估输出。
  
  处理步骤：
  1. 收集专家A、B、C对每种材料的评分
  2. 计算各维度的平均分和标准差
  3. 应用一致性系数调整最终得分
  4. 根据加权公式计算综合得分
  5. 确定材料的最终排名
  
  加权计算公式：
  最终得分 = 0.50×催化性能 + 0.10×经济可行性 + 0.10×环境友好性 + 0.10×技术可行性 + 0.20×结构合理性
  
  一致性分析：
  1. 计算每个维度在三个专家评分中的标准差
  2. 计算一致性系数 Cj = 1 - (SD/mean)
  3. 应用一致性系数调整最终得分
  4. 标记标准差 > 2.0 的维度以便审查
  
  排名规则：
  - Excellent: 所有维度≥8且综合得分≥8.0
  - Good: 所有维度≥6且综合得分≥6.0
  - Average: 综合得分≥4.0
  - Poor: 综合得分≥2.0
  - Invalid: 任一维度=1或综合得分<2.0

expected_output: |
  最终验证报告，包含：
  1. 专家评分汇总表（A、B、C）
  2. 各维度的平均分和标准差
  3. 一致性分析结果
  4. 加权计算和最终得分
  5. 每种材料的最终排名
  6. 关键改进建议

user_requirement_prefix: "\n\n用户具体需求："
