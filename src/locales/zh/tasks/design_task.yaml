description: |
  根据用户需求设计水处理材料方案。
  
  ⚠️ 工具调用限制（严格遵守）：
  - 每种工具最多调用 2 次
  - Structure Validator 最多调用 2 次（验证失败时选择备选设计，不要反复验证）
  - Material Identifier 最多调用 2 次
  - 总工具调用不超过 8 次
  
  设计步骤（精简高效）：
  1. 分析目标污染物特性 → 调用 PubChem 1次
  2. 选择材料类型 → 调用 Material Identifier 1次
  3. 查询材料数据库 → 调用 Materials Project 1次
  4. 验证材料结构 → 调用 Structure Validator 1次
  5. 如验证失败，选择备选设计方案（不再重复验证）
  
  工具使用策略（限流与复用）：
  1. **污染物分析**（1次调用）：
     - PubChem 查询目标污染物信息
  
  2. **材料识别**（1次调用）：
     - Material Identifier 确定材料类型
  
  3. **数据查询**（1-2次调用）：
     - Materials Project 获取材料结构数据
     - 优先复用已获取的数据
  
  4. **结构验证**（最多2次调用）：
     - Structure Validator 验证材料结构
     - 验证失败时选择备选方案，不要循环验证
  
  设计要点：
  - 确保材料具有良好的催化性能和结构稳定性
  - 验证失败时选择备选设计，避免反复验证
  - 优先复用已获取的工具数据

expected_output: |
  提供完整的材料设计方案，包括：
  1. 材料组成（材料类型和关键结构参数）
  2. 设计原理说明
  3. 稳定性保障措施
  4. 预期的催化性能
  5. 详细的结构描述（按照材料类型分类和结构描述要求）
  6. 合成可行性评估

user_requirement_prefix: "\n\n用户具体需求："
feedback_prefix: "\n\n根据评估反馈进行优化设计：\n"
