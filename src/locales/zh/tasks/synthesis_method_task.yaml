description: |
  请基于最终验证通过的材料方案，设计详细的合成方法和工艺流程：
  
  **重要说明**：在开始设计合成方法之前，必须明确最终验证报告中排名最前的具体材料作为合成目标。
  
  设计步骤：
  1. 确定合成目标：明确最终验证报告中排名最前的具体材料
  2. 合成策略设计：根据材料的结构参数设计合成路线
  3. 合成步骤细化：明确每个合成步骤的具体操作
  4. 工艺参数优化：确定关键工艺参数的数值范围
  5. 设备和安全要求：列出所需的设备和安全措施
  6. 质量控制指标：确定关键质量控制点和表征方法
  
  工具使用策略：
  1. **合成目标确认阶段**：调用Material Identifier Tool和Structure Validator Tool
  2. **原材料信息收集阶段**：调用PubChem工具查询原材料性质和安全性
  3. **合成路线设计阶段**：调用Material Search Tool查询类似材料合成方法
  4. **工艺参数优化阶段**：调用Formula2Properties Tool预测产物性质
  5. **安全风险评估阶段**：调用PubChem工具查询安全数据
  6. **可行性验证阶段**：交叉验证所有工具查询结果
  
  设计要点：
  - 确保合成方法的可行性和可重复性
  - 优化工艺参数以获得最佳材料性能
  - 考虑工业化生产的可行性和成本控制
  - **必须在设计开始时明确指出将要合成的具体材料名称和化学式**
  - 每个工具调用都必须记录具体的参数和返回结果

expected_output: |
  提供完整的合成方法方案，包括：
  1. 明确的合成目标：具体材料名称、化学式和选择理由
  2. 详细的合成策略和路线设计
  3. 具体的合成步骤和操作条件
  4. 关键工艺参数及其控制范围
  5. 所需设备和安全要求
  6. 质量控制指标和表征方法

user_requirement_prefix: "\n\n用户具体需求："
